name: .github/workflows/build.yml
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Generate Buildozer Spec
        run: |
          buildozer init
          sed -i 's/title = My Application/title = Market Trends AI/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = stockscanner/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests,beautifulsoup4/' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          yes y | buildozer -v android debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Market-Trends-AI-APK
          path: bin/*.apk


